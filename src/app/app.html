<header class="site-header">
  <a class="brand" href="#" aria-label="{{ companyName }}">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M4 31 16.5 9l7 12 4-7L38 31H4Z" />
      <path d="m11 31 10-13 9 13H11Z" />
    </svg>
    <span>{{ companyName }}</span>
  </a>

  <nav class="main-nav" aria-label="Основная навигация">
    <a href="#home" class="active">Главная</a>
    <a href="#about">О нас</a>
    <a href="#tours">Туры</a>
    <a href="#gallery">Галерея</a>
    <a href="#reviews">Отзывы</a>
  </nav>

  <a class="header-contact" href="tel:+78005553535">Связаться с нами</a>
</header>

<main>
  <section class="hero" id="home" aria-labelledby="hero-title">
    <div class="hero-content">
      <p class="eyebrow">ПУТЕШЕСТВУЙ С НАМИ</p>
      <h1 id="hero-title">НАСЛАДИСЬ ПРОГУЛКОЙ В ГОРАХ<br />С КОМФОРТОМ</h1>
      <p class="hero-description">
        Открой для себя красоту гор и выбери путешествие по душе
      </p>

      <form class="tour-search" (submit)="$event.preventDefault()">
        <label class="search-field">
          <span>Направление</span>
          <select aria-label="Направление">
            <option>Куда отправимся?</option>
            <option>Алтай</option>
            <option>Кавказ</option>
          </select>
        </label>
        <label class="search-field">
          <span>Дата поездки</span>
          <input type="date" aria-label="Дата поездки" />
        </label>
        <label class="search-field">
          <span>Количество человек</span>
          <select aria-label="Количество человек">
            <option>2 человека</option>
            <option>1 человек</option>
            <option>3 и более</option>
          </select>
        </label>
        <button class="search-button" type="submit">Найти тур</button>
      </form>

      <a class="scroll-hint" href="#about" aria-label="Прокрутить вниз">
        <span></span>
      </a>
    </div>
  </section>
</main>
